name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      # S3-compatible server for the s3 driver contract (MinIO images are no longer published).
      s3:
        image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        env:
          RUSTFS_ACCESS_KEY: fmtest
          RUSTFS_SECRET_KEY: fmtest-secret
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Wait for S3
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000 && exit 0; sleep 1; done; exit 1
      - run: bun run check
        env:
          FM_TEST_S3_ENDPOINT: http://localhost:9000

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  registry-smoke:
    name: Registry install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run registry:smoke

  workers:
    name: "Workers: R2 contract and worker build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test registry/fm/drivers/r2.test.ts
      - run: bun run --filter @bkhq/fm-web build
      - run: bun run --filter @bkhq/fm-worker build
        env:
          WRANGLER_SEND_METRICS: "false"
